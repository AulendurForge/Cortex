name: cortex

# Development stack. Image tags default to the values in versions.env; `make up` exports
# that file so the two never drift. Run `make up` (recommended) or, standalone:
#   set -a; . ./versions.env; set +a; docker compose -f docker.compose.dev.yaml up -d
#
# Optional profiles:  linux -> node-exporter + cadvisor,  gpu -> dcgm-exporter,  tools -> pgadmin
# Port notes: Prometheus host port defaults to ${PROM_PORT:-19090} (avoids Cockpit on 9090).

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cortex"], interval: 5s, timeout: 5s, retries: 10 }
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only: the gateway (host network) connects via 127.0.0.1; non-standard port avoids conflicts
    ports:
      - "127.0.0.1:${CORTEX_POSTGRES_PORT:-15432}:5432"

  redis:
    <<: *restart
    image: ${REDIS_IMAGE:-redis:7}
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${CORTEX_REDIS_PORT:-16379}:6379"

  gateway:
    <<: *restart
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cortex-gateway:dev
    # Host network: the API is reachable at http://<HOST_IP>:8084 from the LAN and at
    # http://host.docker.internal:8084 from other containers without extra wiring.
    network_mode: host
    # The entrypoint drops privileges to the `cortex` user and joins the docker socket's group
    # automatically. Set CORTEX_RUN_AS_ROOT=true to keep the old root behaviour.
    environment:
      # --- auth (DEV ONLY: accept any bearer token on /v1) ---
      GATEWAY_DEV_ALLOW_ALL_KEYS: "true"
      # `make up` generates the secrets and asks for the admin credentials once (scripts/ensure-env.sh);
      # standalone compose users put them in .env. There are no default passwords.
      INTERNAL_VLLM_API_KEY: ${INTERNAL_VLLM_API_KEY:?set INTERNAL_VLLM_API_KEY in .env (make up generates it)}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: "false"
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_ORG: ${ADMIN_BOOTSTRAP_ORG:-Default}
      # --- CORS: browser origins that may call the API with cookies ---
      CORS_ENABLED: "true"
      HOST_IP: ${HOST_IP:-localhost}
      CORS_ALLOW_ORIGINS: http://${HOST_IP:-localhost}:${FRONTEND_PORT:-3001},http://localhost:${FRONTEND_PORT:-3001},http://127.0.0.1:${FRONTEND_PORT:-3001}
      REQUEST_MAX_BODY_BYTES: ${REQUEST_MAX_BODY_BYTES:-8388608}
      # --- static upstream pools (optional; managed models register themselves) ---
      VLLM_GEN_URLS: ""
      VLLM_EMB_URLS: ""
      # --- storage: container paths + the host paths handed to model containers ---
      CORTEX_MODELS_DIR: /var/cortex/models
      HF_CACHE_DIR: /var/cortex/hf-cache
      CORTEX_EXPORT_DIR: /var/cortex/exports
      CORTEX_EXPORT_DIR_HOST: ${CORTEX_EXPORT_DIR:-/var/cortex/exports}
      # Transfer drives (USB/NAS) mounted on the host under /media, /mnt or /run/media are visible
      # to the Deployment page through these bind mounts (see volumes below)
      CORTEX_TRANSFER_DIRS: /var/cortex/exports,/host/media,/host/mnt,/host/run/media
      CORTEX_VERSION: ${CORTEX_VERSION:-0.2.0}
      CORTEX_INFRA_IMAGES: ${POSTGRES_IMAGE:-postgres:16},${REDIS_IMAGE:-redis:7},${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1},${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.8.2},${DCGM_EXPORTER_IMAGE:-nvidia/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04},${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.2}
      CORTEX_MODELS_DIR_HOST: ${CORTEX_MODELS_DIR:-/var/cortex/models}
      HF_CACHE_DIR_HOST: ${HF_CACHE_DIR:-/var/cortex/hf-cache}
      # --- engine images (defaults = versions.env = backend/src/config.py) ---
      VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.28.0}
      LLAMACPP_IMAGE: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b10731}
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      # --- lifecycle ---
      STOP_MODELS_ON_SHUTDOWN: ${STOP_MODELS_ON_SHUTDOWN:-false}
      MODEL_RECONCILE_SEC: ${MODEL_RECONCILE_SEC:-15}
      # --- infra (loopback because of host networking) ---
      DATABASE_URL: postgresql+asyncpg://cortex:cortex@127.0.0.1:${CORTEX_POSTGRES_PORT:-15432}/cortex
      REDIS_URL: redis://127.0.0.1:${CORTEX_REDIS_PORT:-16379}/0
      PROMETHEUS_URL: http://127.0.0.1:${PROM_PORT:-19090}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # rw: multipart GGUF handling and exports write here
      - ${CORTEX_MODELS_DIR:-/var/cortex/models}:/var/cortex/models
      - ${HF_CACHE_DIR:-/var/cortex/hf-cache}:/var/cortex/hf-cache
      - ${CORTEX_EXPORT_DIR:-/var/cortex/exports}:/var/cortex/exports
      # Host mount points for transfer drives (bundles are read from / written to these)
      - /media:/host/media
      - /mnt:/host/mnt
      - /run/media:/host/run/media
    # The gateway itself needs no GPU; NVML metrics degrade gracefully without the NVIDIA runtime.

  frontend:
    <<: *restart
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: cortex-frontend:dev
    environment:
      NODE_ENV: development
      # The UI derives the gateway URL from the browser hostname; this only labels the host IP display
      # Gateway address for the browser, read at request time: empty = <this host>:8084 (LAN/dev),
      # "/" = same origin (behind the TLS reverse proxy), or a full URL.
      CORTEX_GATEWAY_URL: ${CORTEX_GATEWAY_URL:-}
      NEXT_PUBLIC_HOST_IP: ${HOST_IP:-localhost}
    ports: ["${FRONTEND_PORT:-3001}:3001"]
    depends_on:
      gateway: { condition: service_started }
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  prometheus:
    <<: *restart
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["${PROM_PORT:-19090}:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-7d}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  node-exporter:
    <<: *restart
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.8.2}
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # Published on loopback so `make health` can probe it; Prometheus scrapes it over the compose network
    ports: ["127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"]
    profiles: ["linux"]

  dcgm-exporter:
    <<: *restart
    image: ${DCGM_EXPORTER_IMAGE:-nvidia/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    runtime: nvidia
    cap_add:
      - SYS_ADMIN
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports: ["127.0.0.1:${DCGM_PORT:-9400}:9400"]
    profiles: ["gpu"]

  cadvisor:
    <<: *restart
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.2}
    privileged: true
    # cadvisor listens on 8080 inside the container
    ports: ["127.0.0.1:${CADVISOR_PORT:-8085}:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    profiles: ["linux"]

  pgadmin:
    <<: *restart
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:8.7}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    # Loopback only and opt-in: `make up PROFILES=tools` or COMPOSE_PROFILES=tools
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles: ["tools"]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  pgadmin_data:
