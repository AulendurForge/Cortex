[pytest]
testpaths = src/tests
asyncio_mode = auto
markers =
    unit: pure unit tests, no running gateway or database required (CI default)
    integration: needs a running gateway at CORTEX_GATEWAY_URL (default http://127.0.0.1:8084)
    live: starts a real model container; needs a GPU host and CORTEX_LIVE_GGUF
addopts = -p no:cacheprovider
